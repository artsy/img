version: 2.1

orbs:
  yarn: artsy/yarn@6.2.0
  auto: artsy/auto@dev:2aef03cbfbbf0911d52c58abd31a4457
  aws-s3: circleci/aws-s3@2.0.0

workflows:
  build_and_verify:
    jobs:
      - yarn/workflow-queue
      - yarn/update-cache:
          requires:
            - yarn/workflow-queue
      - auto/publish-canary:
          context: npm-deploy
          filters:
            branches:
              ignore: main
          requires:
            - yarn/update-cache
      - auto/publish:
          context: npm-deploy
          filters:
            branches:
              only: main
          requires:
            - yarn/update-cache
